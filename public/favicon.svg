<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <title>La Nuit du Bout du Monde</title>
  <!--
    La ville, en 32 pixels. Même vocabulaire que l'accueil : des tours Art Déco
    à gradins, plates, sans dégradé ni halo, sur deux plans — le néon vif devant,
    le même rose en sourdine derrière.

    Tout est calé sur une grille de 1 px, avec une colonne noire entre deux tours
    de même ton : à 16 px, deux tours qui se touchent ne font plus qu'un bloc.
    La ziggourat centrale est centrée sur x=16 à chaque gradin, sans quoi la
    flèche part de travers dès qu'on réduit.
  -->
  <rect width="32" height="32" fill="#080b12"/>

  <!-- Arrière-plan : le néon en sourdine -->
  <g fill="#a50e52">
    <rect x="0"  y="22" width="3" height="8"/>
    <rect x="24" y="20" width="3" height="10"/>
    <rect x="29" y="24" width="3" height="6"/>
  </g>

  <!-- Premier plan : les gradins, et la flèche centrale -->
  <g fill="#ff2e88">
    <rect x="4"  y="25" width="3" height="5"/>
    <rect x="8"  y="20" width="3" height="10"/>
    <rect x="12" y="15" width="8" height="15"/>
    <rect x="14" y="10" width="4" height="20"/>
    <rect x="15" y="4"  width="2" height="26"/>
    <rect x="21" y="23" width="2" height="7"/>
  </g>
</svg>
