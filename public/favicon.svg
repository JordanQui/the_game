<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <title>La Nuit du Bout du Monde</title>
  <!--
    La ville, en 32 pixels. Même vocabulaire que l'accueil : des tours Art Déco
    à gradins, plates, sans dégradé ni halo — et deux plans, comme la skyline du
    LoginScreen. Le fond est l'ink-900 de l'interface, les tours son néon.
    Tout est calé sur une grille de 1 px : à 16 px, un bord à virgule bave.
  -->
  <rect width="32" height="32" fill="#080b12"/>

  <!-- Arrière-plan : néon éteint, le même rose en sourdine -->
  <g fill="#a50e52">
    <rect x="0"  y="21" width="5" height="11"/>
    <rect x="8"  y="18" width="4" height="14"/>
    <rect x="20" y="17" width="4" height="15"/>
    <rect x="28" y="20" width="4" height="12"/>
  </g>

  <!-- Premier plan : les gradins, et la flèche centrale -->
  <g fill="#ff2e88">
    <rect x="3"  y="24" width="4"  height="8"/>
    <rect x="12" y="14" width="8"  height="18"/>
    <rect x="14" y="10" width="4"  height="22"/>
    <rect x="15" y="4"  width="2"  height="28"/>
    <rect x="24" y="22" width="5"  height="10"/>
  </g>

  <!-- Le trait de rue : la lumière basse qui court sous les tours -->
  <rect x="0" y="30" width="32" height="1" fill="#ff2e88"/>
</svg>
